id: org-solenopsis-invicta
slug: solenopsis-invicta
scientificName: Solenopsis invicta
commonName: Red imported fire ant
overview: >-
  Solenopsis invicta is an ant species widely studied for defensive sting behavior,
  rapid colony recruitment, and ecological impact where established.
naturalHistory:
  - Workers can rapidly recruit nestmates when disturbed.
  - Colonies occupy disturbed soils, lawns, fields, and urban interfaces.
  - Defensive behavior commonly involves grip-and-sting sequences.
taxonomy:
  kingdom: Animalia
  phylum: Arthropoda
  className: Insecta
  order: Hymenoptera
  family: Formicidae
  genus: Solenopsis
  species: Solenopsis invicta
deliveryMechanism:
  route: sting
  summary: Mandibles anchor while the abdomen rotates to place the stinger and inject venom.
  sequence:
    - Mandibles grip skin or substrate.
    - Abdomen rotates under the body axis.
    - Stinger penetrates tissue.
    - Venom is injected into local tissue.
habitats:
  - id: hab-disturbed-soils
    name: Disturbed soils and anthropogenic landscapes
    summary: Often established in open disturbed habitats, lawns, and managed landscapes.
ecologicalRoles:
