  summaryPoints:
    - >-
      Solenopsis invicta is a social, colony-forming ant known for fast collective responses when
      nest structure is disturbed.
    - >-
      Colony organization contributes to rapid shifts from foraging to coordinated defense.
    - >-
      The species is commonly associated with open, sun-exposed, and human-managed environments.
    - >-
      Defensive behavior is often described as a grip-and-sting sequence.
