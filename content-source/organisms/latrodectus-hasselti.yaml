overview: >-
  Latrodectus hasselti is a venomous spider that uses a web-associated bite to subdue prey and
  defend itself. Its venom contains neuroactive components associated with latrodectism.
naturalHistory:
  - It builds irregular webs in sheltered locations.
  - The species is associated with human-modified habitats as well as natural environments.
  - Females are substantially larger than males.
