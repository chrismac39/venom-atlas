scientificName: Heloderma suspectum
commonName: Gila monster
toxicStrategy: venomous
overview: >-
  Heloderma suspectum is a venomous lizard that delivers oral gland secretions through grooved teeth
  during a prolonged bite. It is distinct from snakes and does not inject venom through hollow fangs.
naturalHistory:
  - It is a slow-moving lizard associated with arid and semi-arid habitats.
  - Venom glands occur in the lower jaw and secretions enter bite wounds through grooved teeth.
  - Seasonal activity and feeding behavior reflect desert environmental conditions.
