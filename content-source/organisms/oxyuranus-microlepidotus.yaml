deliveryMechanism:
  route: bite
  summary: Paired front fangs inject venom during a bite, including rapid repeated bites during prey capture or defense.
  sequence:
    - The snake opens its mouth and aligns the front fangs.
    - Fangs penetrate tissue during the bite.
    - Venom is delivered through the fang apparatus.
    - Venom disperses from the bite site.
