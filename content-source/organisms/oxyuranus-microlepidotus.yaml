scientificName: Oxyuranus microlepidotus
commonName: Inland taipan
toxicStrategy: venomous
overview: >-
  Oxyuranus microlepidotus is a large Australian elapid whose bite-delivered venom and
  remote semi-arid ecology provide a reference profile for venomous reptiles.
naturalHistory:
  - It occupies cracking-clay floodplains and nearby arid habitats in inland Australia.
  - Small mammals, particularly rodents, dominate its reported diet.
  - It is rarely encountered by people across its remote range.
