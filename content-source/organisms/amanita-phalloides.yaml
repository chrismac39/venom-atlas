id: org-amanita-phalloides
slug: amanita-phalloides
scientificName: Amanita phalloides
commonName: Death cap mushroom
toxicStrategy: poisonous
overview: >-
  Amanita phalloides is a poisonous mushroom whose amatoxins can cause severe liver injury after
  ingestion. Toxicity is associated with consuming the mushroom, not with active venom delivery.
naturalHistory:
  - It forms mycorrhizal associations with trees in temperate habitats.
  - Fruiting bodies can resemble edible mushroom species.
  - Amatoxin-containing tissues remain hazardous after cooking.
taxonomy:
  kingdom: Fungi
  phylum: Basidiomycota
  className: Agaricomycetes
  order: Agaricales
  family: Amanitaceae
  genus: Amanita
  species: Amanita phalloides
deliveryMechanism:
  route: ingestion
  summary: Poisoning follows ingestion of mushroom tissue containing amatoxins.
  sequence:
    - Mushroom tissue is collected or mistaken for an edible species.
    - Toxic tissue is ingested.
    - Amatoxins are absorbed and reach susceptible organs.
habitats:
  - id: hab-amanita-temperate-woodland
    name: Temperate woodland
    summary: Commonly associated with temperate forests and trees with which it forms mycorrhizae.
ecologicalRoles:
  - id: eco-amanita-mycorrhiza
    role: Mycorrhizal association
    summary: The species participates in below-ground nutrient exchange with host trees.
geographyVisualizations: []
externalProfile:
  sourceLabel: Centers for Disease Control and Prevention
  sourceUrl: https://www.cdc.gov/healthy-water/hazards/mushroom-poisoning/index.html
  summaryPoints:
    - Mushroom poisoning is an ingestion hazard and should not be represented as venom delivery.
  imagePaths: []
evidence:
  id: ev-amanita-profile
  confidence: moderate
  evidenceType: database
  citationIds:
    - cit-cdc-amanita-phalloides
