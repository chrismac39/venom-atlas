id: org-datura-stramonium
slug: datura-stramonium
scientificName: Datura stramonium
commonName: Jimsonweed
toxicStrategy: poisonous
overview: >-
  Datura stramonium is a poisonous plant containing tropane alkaloids that can cause anticholinergic
  toxicity after ingestion. The plant does not inject venom.
naturalHistory:
  - It is an annual herb found in disturbed soils and agricultural margins.
  - Leaves, seeds, and other tissues contain biologically active alkaloids.
  - Seed capsules support dispersal into disturbed habitats.
taxonomy:
  kingdom: Plantae
  phylum: Tracheophyta
  className: Magnoliopsida
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: Datura stramonium
deliveryMechanism:
  route: ingestion
  summary: Exposure occurs when plant tissue or seeds are ingested.
  sequence:
    - Plant tissue or seeds are collected.
    - Toxic material is ingested.
    - Tropane alkaloids are absorbed and affect muscarinic signaling.
habitats:
  - id: hab-datura-disturbed-ground
    name: Disturbed ground and field margins
    summary: Often occurs in disturbed soils, waste ground, and agricultural margins.
