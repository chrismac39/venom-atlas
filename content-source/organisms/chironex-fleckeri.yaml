scientificName: Chironex fleckeri
commonName: Australian box jellyfish
toxicStrategy: venomous
overview: >-
  Chironex fleckeri is a box jellyfish whose tentacles contain nematocysts that discharge venom on
  contact. It is a cnidarian, not a biting or stinging animal with a centralized stinger.
naturalHistory:
  - It is a marine cnidarian found in tropical waters.
  - Tentacles carry specialized cells for rapid contact-mediated toxin delivery.
  - Seasonal and local environmental conditions influence encounters.
