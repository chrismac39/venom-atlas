id: org-ornithorhynchus-anatinus
slug: ornithorhynchus-anatinus
scientificName: Ornithorhynchus anatinus
commonName: Platypus
toxicStrategy: venomous
overview: >-
  Ornithorhynchus anatinus is a semi-aquatic monotreme; adult males deliver venom with a
  hind-ankle spur, making it a distinctive reference organism for venomous mammals.
naturalHistory:
  - It is endemic to eastern Australia and Tasmania and depends on freshwater systems.
  - It forages for aquatic invertebrates using pressure-sensitive and electro-sensitive receptors in the bill.
  - Functional venom spurs are associated with adult males and become more active around the breeding season.
taxonomy:
  kingdom: Animalia
  phylum: Chordata
  className: Mammalia
  order: Monotremata
  family: Ornithorhynchidae
  genus: Ornithorhynchus
  species: Ornithorhynchus anatinus
deliveryMechanism:
  route: spur
  summary: An adult male can drive a hind-ankle spur connected by a duct to a venom gland into tissue.
  sequence:
    - The hind limb is positioned against the target.
    - The keratinous ankle spur penetrates tissue.
    - Venom travels from the crural gland through the connecting duct.
    - Venom is delivered into the puncture wound.
