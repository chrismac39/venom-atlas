id: org-clostridium-botulinum
slug: clostridium-botulinum
scientificName: Clostridium botulinum
commonName: Botulinum bacterium
toxicStrategy: toxin_producing
overview: >-
  Clostridium botulinum is an anaerobic, spore-forming bacterium that can produce botulinum
  neurotoxins. Botulism is the disease caused by exposure to those toxins; the bacterium is not
  venomous and does not deliver toxin through a bite or sting.
naturalHistory:
  - It forms environmentally persistent spores that can occur in soil and aquatic sediments.
  - Under suitable low-oxygen conditions, bacterial growth can produce botulinum neurotoxin.
  - Human botulism can follow foodborne, wound-associated, or intestinal exposure pathways.
taxonomy:
  kingdom: Bacteria
  phylum: Bacillota
  className: Clostridia
  order: Eubacteriales
  family: Clostridiaceae
  genus: Clostridium
  species: Clostridium botulinum
deliveryMechanism:
  route: production
  summary: The bacterium produces botulinum neurotoxin under suitable growth conditions; disease follows exposure to the toxin rather than bacterial venom delivery.
  sequence:
    - Spores or cells reach a suitable low-oxygen environment.
    - Toxin-producing growth can occur under favorable conditions.
    - Botulinum neurotoxin is released into the relevant food, wound, or intestinal context.
    - Human disease follows exposure and uptake of neurotoxin.
habitats:
  - id: hab-clostridium-soil-sediment
    name: Soil and aquatic sediments
    summary: Spores can persist in environmental soils and sediments; occurrence does not establish a complete disease-risk range.
ecologicalRoles:
