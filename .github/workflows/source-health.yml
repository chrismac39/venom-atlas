name: Source health

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check citation health
        run: pnpm research:source-health -- --output=source-health-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: source-health-report
          path: source-health-report.json